[package]
name = "inkapp-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "In-software loop simulator and layers inspector for inkapp"

[dependencies]
inkapp-core = { path = "../inkapp-core" }
typst = "0.14"
typst-render = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The harness src is generic over `&dyn Device`; the concrete reMarkable device
# is only needed to drive the simulator/exercisers in tests.
rm-device = { path = "../rm-device" }
# rm-files is needed by the transform-fidelity test to read raw device coords
# from a synthesized .rm capture and measure centroid error directly.
rm-files = { path = "../rm-files" }
# rm-cloud backs the manual on-device bars (acceptance/record) that push and pull
# documents to/from the reMarkable cloud.
rm-cloud = { path = "../rm-cloud" }
zip = "2"
tempfile = "3"
reading-queue = { path = "../../apps/reading-queue" }
inkapp-readwise-reader = { path = "../inkapp-readwise-reader" }
agenda = { path = "../../apps/agenda" }
inkapp-ics = { path = "../inkapp-ics" }
inkapp-localcal = { path = "../inkapp-localcal" }
inkapp-content = { path = "../inkapp-content" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
