[package]
name = "rmapps"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Unified CLI for the rmapps reMarkable toolset (auth, generate, sync) over the native rm-cloud client"

[[bin]]
name = "rmapps"
path = "src/main.rs"

[dependencies]
rm-cloud = { path = "../../crates/rm-cloud" }
rmbujo = { path = "../../crates/rmbujo" }
rmreader = { path = "../../crates/rmreader" }
rmdigest = { path = "../../crates/rmdigest" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
