[package]
name = "inkapp-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "In-software loop simulator and layers inspector for inkapp"

[dependencies]
inkapp-core = { path = "../inkapp-core" }
inkapp-remarkable = { path = "../inkapp-remarkable" }
typst = "0.14"
typst-render = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
