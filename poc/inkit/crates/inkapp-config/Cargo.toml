[package]
name = "inkapp-config"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "End-user configuration for inkapp: typed store, schema registry, and CLI"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
inventory = "0.3"
thiserror = "2"
inkapp-config-derive = { path = "../inkapp-config-derive" }
# CLI deps (optional, behind the `cli` feature — added in a later task)
clap = { version = "4", features = ["derive"], optional = true }

[features]
cli = ["dep:clap"]

[dev-dependencies]
serde_json = "1"
tempfile = "3"
