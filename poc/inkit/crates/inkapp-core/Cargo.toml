[package]
name = "inkapp-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Device-agnostic framework core for inkapp: Typst render, manifest, components, readback"

[dependencies]
inkapp-config = { path = "../inkapp-config" }
foyer = { version = "0.22", features = ["serde"] }
sha2 = "0.10"
typst = "0.14"
typst-pdf = "0.14"
typst-render = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
comemo = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.36"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"
base64 = "0.22"
tempfile = "3"
futures = "0.3"
async-trait = "0.1"
image = { version = "0.25", features = ["avif-native"] }
reqwest = "0.12"
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
