[package]
name = "inkapp-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Device-agnostic framework core for inkapp: Typst render, manifest, widgets, readback"

[dependencies]
typst = "0.14"
typst-pdf = "0.14"
typst-render = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
comemo = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.36"
chacha20poly1305 = "0.10"
getrandom = "0.2"
