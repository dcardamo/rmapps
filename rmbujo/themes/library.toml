# Editorial palette. Two-color system: indigo (primary) + tomato (accent),
# with rust as a warm secondary, on warm off-white paper.
paper = "#F3F1EA"      # page background (warm off-white)
ink = "#1A1A18"        # body text (near-black)
primary = "#2A2F6B"    # indigo — headlines, masthead, nav fill
accent = "#CF3A2B"     # tomato — numbers, links, pills/badges
rust = "#9C3A1B"       # warm secondary (darker than accent)
muted = "#5E6166"      # secondary metadata
faint = "#9D9C93"      # tertiary labels
rule = "#E0DDD2"       # hairlines / dividers / underlines
nav = "#F4F1E8"        # light text on the indigo bar / cover
dot = "#C9C6BA"        # dot-grid color (soft warm grey)
cover_to = "#1A1E48"   # darker indigo for the cover gradient
