[package]
name = "rm-cloud"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust client for the reMarkable Cloud sync protocol (content-addressed snapshots, path ops, working-set sync)"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
crc32c = "0.6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
lopdf = "0.36"
# rustls (not native-tls/OpenSSL): when this crate is linked alongside typst in
# one binary (apps/rmapps), OpenSSL's atexit handler segfaults at process
# teardown. rustls is pure-Rust and avoids it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# The single workspace .rm reader is `rmfiles`; alias it to `rm_files` so this
# crate's `use rm_files::…` stays unchanged.
rm-files = { path = "../rmfiles", package = "rmfiles" }
zip = "2"
tempfile = "3"
axum = { version = "0.8", optional = true }

[features]
fake = ["dep:axum", "tokio/full"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[test]]
name = "fake_lifecycle"
required-features = ["fake"]

[[test]]
name = "fake_content_only"
required-features = ["fake"]

[[test]]
name = "fake_conflict"
required-features = ["fake"]

[[test]]
name = "fake_concurrency"
required-features = ["fake"]

[[test]]
name = "fake_auth"
required-features = ["fake"]

[[test]]
name = "fake_snapshot"
required-features = ["fake"]

[[test]]
name = "fake_porcelain"
required-features = ["fake"]

[[test]]
name = "fake_sync"
required-features = ["fake"]

[[test]]
name = "fake_paths"
required-features = ["fake"]

[[test]]
name = "fake_persistence"
required-features = ["fake"]
